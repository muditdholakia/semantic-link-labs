version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directories:
      - "/"
      - "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      learning-dependencies:
        patterns: ["*"]
